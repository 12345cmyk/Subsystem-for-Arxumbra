[build]
target = "x86_64-unknown-linux-gnu"
rustflags = [
    "-Z", "unstable-options",
    "-C", "opt-level=3",
    "-C", "target-cpu=generic",
    "-C", "lto=fat",
    "-C", "codegen-units=1",
    "-C", "panic=abort",
    "-C", "overflow-checks=off",
    "-C", "debug-assertions=off",
    "-C", "debuginfo=0",
    "-C", "strip=symbols",
    "-C", "embed-bitcode=yes",
    "-C", "force-frame-pointers=no",
    "-C", "llvm-args=-inline-threshold=400"
]

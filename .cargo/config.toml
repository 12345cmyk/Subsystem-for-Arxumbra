# Кроссплатформенные флаги сборки.
#
# Linux x86_64: полный анти-SIGILL набор (глобальный SSE2-базлайн) + линкер-флаги
# GNU ld + усиленный инлайнинг. Windows x86_64: то же без -Wl (MSVC-линкер).
# macOS aarch64: флаги не нужны (базлайн ARM64). Секции cfg() конкатенируются
# с флагами, которые cargo-pgo добавляет через --config при PGO/BOLT-сборке
# (проверено: оба набора попадают в rustc).

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))']
rustflags = [
    "-C", "target-cpu=x86-64",
    "-C", "target-feature=-sse3,-ssse3,-sse4.1,-sse4.2,-popcnt,-avx,-avx2,-fma,-f16c,-bmi1,-bmi2,-lzcnt,-movbe,-tbm,-avx512f,-avx512bw,-avx512cd,-avx512dq,-avx512vl,-avx512ifma,-avx512vbmi,-avx512vbmi2,-avx512vnni,-avx512vpopcntdq,-avx512bitalg,-vaes,-vpclmulqdq,-gfni,-sha",
    "-C", "link-arg=-Wl,-O1",
    "-C", "link-arg=-Wl,--as-needed",
    "-C", "link-arg=-Wl,--gc-sections",
    "-C", "link-arg=-Wl,-z,norelro",
    "-C", "link-arg=-Wl,--build-id=none",
    "-C", "llvm-args=--inline-threshold=1000",
]

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))']
rustflags = [
    "-C", "target-cpu=x86-64",
    "-C", "target-feature=-sse3,-ssse3,-sse4.1,-sse4.2,-popcnt,-avx,-avx2,-fma,-f16c,-bmi1,-bmi2,-lzcnt,-movbe,-tbm,-avx512f,-avx512bw,-avx512cd,-avx512dq,-avx512vl,-avx512ifma,-avx512vbmi,-avx512vbmi2,-avx512vnni,-avx512vpopcntdq,-avx512bitalg,-vaes,-vpclmulqdq,-gfni,-sha",
    "-C", "llvm-args=--inline-threshold=1000",
]

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))']
rustflags = [
    "-C", "target-cpu=x86-64",
    "-C", "target-feature=-sse3,-ssse3,-sse4.1,-sse4.2,-popcnt,-avx,-avx2,-fma,-f16c,-bmi1,-bmi2,-lzcnt,-movbe,-tbm,-avx512f,-avx512bw,-avx512cd,-avx512dq,-avx512vl,-avx512ifma,-avx512vbmi,-avx512vbmi2,-avx512vnni,-avx512vpopcntdq,-avx512bitalg,-vaes,-vpclmulqdq,-gfni,-sha",
    "-C", "llvm-args=--inline-threshold=1000",
]

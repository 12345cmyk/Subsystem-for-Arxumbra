name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  Linux-Subsystem-for-Arxumbra:
    name: ${{ matrix.arch }}-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s5
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            pgo: false
            cross: true
            flags: '-C target-cpu=generic -C link-arg=-Wl,-O1 -C link-arg=-Wl,--as-needed -C link-arg=-Wl,--gc-sections -C link-arg=-Wl,-z,norelro -C link-arg=-Wl,--build-id=none -C link-arg=-Wl,--no-eh-frame-hdr -C llvm-args=--inline-threshold=1000 -C llvm-args=--unroll-threshold=500'
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            pgo: true
            cross: false
            flags: '-C target-cpu=x86-64 -C target-feature=-sse3,-ssse3,-sse4.1,-sse4.2,-popcnt,-avx,-avx2,-fma,-f16c,-bmi1,-bmi2,-lzcnt,-movbe,-tbm,-avx512f,-avx512bw,-avx512cd,-avx512dq,-avx512vl,-avx512ifma,-avx512vbmi,-avx512vbmi2,-avx512vnni,-avx512vpopcntdq,-avx512bitalg,-vaes,-vpclmulqdq,-gfni,-sha -C link-arg=-Wl,-O1 -C link-arg=-Wl,--as-needed -C link-arg=-Wl,--gc-sections -C link-arg=-Wl,-z,norelro -C link-arg=-Wl,--build-id=none -C link-arg=-Wl,--no-eh-frame-hdr -C llvm-args=--inline-threshold=1000 -C llvm-args=--unroll-threshold=500'
    env:
      NAME: Linux-Subsystem-for-Arxumbra
      CARGO_BIN: subsystem-for-arxumbra
      SUFFIX: -v0.0.0.0.0.0-s5
      BUILD_STD: -Zbuild-std=std,panic_abort
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Stage 1 - Rust nightly toolchain
        run: |
          rustup toolchain install nightly --profile minimal -c rust-src -c llvm-tools
          rustup default nightly
          rustup target add ${{ matrix.target }}
          rustc -vV

      - name: Stage 2 - system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwayland-dev libxkbcommon-dev pkg-config \
            weston mesa-vulkan-drivers \
            llvm-18 lld-18 xz-utils file
          LLD_BIN="$(command -v ld.lld-18 || command -v ld.lld || ls /usr/lib/llvm-18/bin/ld.lld)"
          [ -x "$LLD_BIN" ] || { echo "::error::lld из пакета lld-18 не найден"; exit 1; }
          sudo mkdir -p /opt/arx-ld
          sudo ln -sf "$LLD_BIN" /opt/arx-ld/ld.lld
          sudo ln -sf "$LLD_BIN" /usr/local/bin/ld.lld
          [ -x /opt/arx-ld/ld.lld ] || { echo "::error::ld.lld недоступен в /opt/arx-ld"; exit 1; }
          /opt/arx-ld/ld.lld --version

      - name: Stage 2a - aarch64 cross toolchain
        if: matrix.cross
        run: |
          sudo dpkg --add-architecture arm64
          sudo python3 - <<'PY'
          import glob, re, os
          for path in glob.glob('/etc/apt/sources.list.d/*.sources') + ['/etc/apt/sources.list']:
              if not os.path.exists(path):
                  continue
              text = open(path).read()
              if path.endswith('.sources'):
                  stanzas = []
                  for stanza in text.split('\n\n'):
                      if re.search(r'(?m)^Types:', stanza) and not re.search(r'(?m)^Architectures:', stanza):
                          stanza = re.sub(r'(?m)^Types:.*$', lambda m: m.group(0) + '\nArchitectures: amd64 i386', stanza, count=1)
                      stanzas.append(stanza)
                  text = '\n\n'.join(stanzas)
              else:
                  text = re.sub(r'(?m)^deb (?!\[)', 'deb [arch=amd64,i386] ', text)
              open(path, 'w').write(text)
          with open('/etc/apt/sources.list.d/ubuntu-ports-arm64.list', 'w') as portslist:
              for suite in ('noble', 'noble-updates', 'noble-security'):
                  portslist.write('deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s main restricted universe multiverse\n' % suite)
          PY
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc-aarch64-linux-gnu libwayland-dev:arm64 libxkbcommon-dev:arm64
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"

      - name: Stage 2b - linker capability probe (lld+ICF или откат на GNU ld)
        run: |
          printf 'int main(void){return 0;}\n' > /tmp/arx_probe.c
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            PROBE_CC="aarch64-linux-gnu-gcc"
          else
            PROBE_CC="cc"
          fi
          if [ -x /opt/arx-ld/ld.lld ] && $PROBE_CC -fuse-ld=lld -B/opt/arx-ld -Wl,--icf=all /tmp/arx_probe.c -o /tmp/arx_probe.out 2>/dev/null; then
            echo "CARGO_LINK_EXTRA=-C link-arg=-fuse-ld=lld -C link-arg=-B/opt/arx-ld -C link-arg=-Wl,--icf=all" >> "$GITHUB_ENV"
            echo "линкер: lld с ICF"
          else
            echo "CARGO_LINK_EXTRA=" >> "$GITHUB_ENV"
            echo "линкер: GNU ld, ICF отключён (lld недоступен компилятору)"
          fi
          rm -f /tmp/arx_probe.out

      - name: Stage 3 - locked dependency fetch
        run: cargo fetch --locked --target ${{ matrix.target }}

      - name: Stage 4a - instrumented build (PGO generate, fat LTO, build-std)
        if: matrix.pgo
        run: |
          mkdir -p pgo-profile
          RUSTFLAGS="${{ matrix.flags }} $CARGO_LINK_EXTRA -Cprofile-generate=$PWD/pgo-profile" cargo build --release --locked --target ${{ matrix.target }} $BUILD_STD

      - name: Stage 4b - plain build (fat LTO, build-std)
        if: ${{ !matrix.pgo }}
        run: RUSTFLAGS="${{ matrix.flags }} $CARGO_LINK_EXTRA" cargo build --release --locked --target ${{ matrix.target }} $BUILD_STD

      - name: Stage 5 - headless profile run (weston + lavapipe, empty stderr)
        if: matrix.pgo
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          weston --backend=headless-backend.so --socket=arx-profile --idle-time=0 &
          for i in $(seq 1 30); do [ -e "$XDG_RUNTIME_DIR/arx-profile" ] && break; sleep 1; done
          [ -e "$XDG_RUNTIME_DIR/arx-profile" ] || { echo "::error::weston не поднялся"; exit 1; }
          export WAYLAND_DISPLAY=arx-profile
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          export WGPU_BACKEND=vulkan
          export LLVM_PROFILE_FILE="$PWD/pgo-profile/default.profraw"
          timeout -s INT 25 target/${{ matrix.target }}/release/$CARGO_BIN 2>/tmp/profile.err || true
          if grep -v "^LLVM Profile Warning:" /tmp/profile.err | grep -q .; then
            echo "::error::Профильный прогон написал в stderr:"
            cat /tmp/profile.err
            exit 1
          fi
          [ -s pgo-profile/default.profraw ] || { echo "::error::профиль PGO не собран"; exit 1; }

      - name: Stage 6 - merge PGO profile
        if: matrix.pgo
        run: |
          PROFDATA=$(find "$(rustc --print sysroot)/lib/rustlib" -name 'llvm-profdata' | head -1)
          [ -x "$PROFDATA" ] || { echo "::error::llvm-profdata из sysroot не найден"; exit 1; }
          "$PROFDATA" merge -o pgo.profdata pgo-profile/

      - name: Stage 7 - PGO build (profile-use, fat LTO, lld, build-std)
        if: matrix.pgo
        run: |
          RUSTFLAGS="${{ matrix.flags }} $CARGO_LINK_EXTRA -Cprofile-use=$PWD/pgo.profdata" cargo build --release --locked --target ${{ matrix.target }} $BUILD_STD

      - name: Stage 8 - verification run (shipped binary, empty stderr)
        if: matrix.pgo
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          weston --backend=headless-backend.so --socket=arx-verify --idle-time=0 &
          for i in $(seq 1 30); do [ -e "$XDG_RUNTIME_DIR/arx-verify" ] && break; sleep 1; done
          [ -e "$XDG_RUNTIME_DIR/arx-verify" ] || { echo "::error::weston не поднялся"; exit 1; }
          export WAYLAND_DISPLAY=arx-verify
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          export WGPU_BACKEND=vulkan
          timeout -s INT 25 target/${{ matrix.target }}/release/$CARGO_BIN 2>/tmp/verify.err || true
          if [ -s /tmp/verify.err ]; then
            echo "::error::Верификация написала в stderr:"
            cat /tmp/verify.err
            exit 1
          fi

      - name: Stage 9 - package
        run: |
          mkdir dist
          FINAL="${{ matrix.arch }}-$NAME$SUFFIX"
          cp target/${{ matrix.target }}/release/$CARGO_BIN "dist/$FINAL"
          chmod 755 "dist/$FINAL"
          tar cf - -C dist "$FINAL" | xz -9e -T0 -c > "dist/$FINAL.tar.xz"
          rm "dist/$FINAL"
          sha256sum dist/*.tar.xz > "dist/SHA256SUMS-${{ matrix.arch }}.txt"

      - name: Stage 10 - binary identity check (ELF, architecture, no debug sections)
        run: |
          FILE_TYPE=$(file -b "target/${{ matrix.target }}/release/$CARGO_BIN")
          echo "$FILE_TYPE"
          case "$FILE_TYPE" in
            *ELF*) ;;
            *) echo "::error::не ELF: $FILE_TYPE"; exit 1;;
          esac
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            WANT="ARM aarch64"
          else
            WANT="x86-64"
          fi
          case "$FILE_TYPE" in
            *"$WANT"*) ;;
            *) echo "::error::ожидалась архитектура $WANT: $FILE_TYPE"; exit 1;;
          esac
          if readelf -S "target/${{ matrix.target }}/release/$CARGO_BIN" | grep -q 'debug'; then
            echo "::error::в бинарнике остались debug-секции"
            exit 1
          fi

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.arch }}-${{ env.NAME }}${{ env.SUFFIX }}
          path: dist/*

  macOS-Subsystem-for-Arxumbra:
    name: ${{ matrix.arch }}-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s5
    runs-on: macos-15
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
            flags: '-C target-cpu=apple-m1 -C link-arg=-Wl,-dead_strip -C link-arg=-Wl,-no_fixup_chains -C llvm-args=--inline-threshold=1000 -C llvm-args=--unroll-threshold=500'
          - target: x86_64-apple-darwin
            arch: x86_64
            flags: '-C target-cpu=x86-64 -C target-feature=-sse3,-ssse3,-sse4.1,-sse4.2,-popcnt,-avx,-avx2,-fma,-f16c,-bmi1,-bmi2,-lzcnt,-movbe,-tbm,-avx512f,-avx512bw,-avx512cd,-avx512dq,-avx512vl,-avx512ifma,-avx512vbmi,-avx512vbmi2,-avx512vnni,-avx512vpopcntdq,-avx512bitalg,-vaes,-vpclmulqdq,-gfni,-sha -C link-arg=-Wl,-dead_strip -C link-arg=-Wl,-no_fixup_chains -C llvm-args=--inline-threshold=1000 -C llvm-args=--unroll-threshold=500'
    env:
      NAME: macOS-Subsystem-for-Arxumbra
      CARGO_BIN: subsystem-for-arxumbra
      SUFFIX: -v0.0.0.0.0.0-s5
      BUILD_STD: -Zbuild-std=std,panic_abort
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Stage 1 - Rust nightly toolchain
        run: |
          rustup toolchain install nightly --profile minimal -c rust-src
          rustup default nightly
          rustup target add ${{ matrix.target }}
          rustc -vV

      - name: Stage 2 - locked dependency fetch
        run: cargo fetch --locked --target ${{ matrix.target }}

      - name: Stage 3 - build (fat LTO, build-std)
        run: RUSTFLAGS="${{ matrix.flags }}" cargo build --release --locked --target ${{ matrix.target }} $BUILD_STD

      - name: Stage 4 - package
        run: |
          mkdir dist
          FINAL="${{ matrix.arch }}-$NAME$SUFFIX"
          cp target/${{ matrix.target }}/release/$CARGO_BIN "dist/$FINAL"
          chmod 755 "dist/$FINAL"
          tar czf "dist/$FINAL.tar.gz" -C dist "$FINAL"
          rm "dist/$FINAL"
          shasum -a 256 dist/*.tar.gz > "dist/SHA256SUMS-${{ matrix.arch }}.txt"

      - name: Stage 5 - binary identity check (Mach-O, architecture)
        run: |
          FILE_TYPE=$(file -b "target/${{ matrix.target }}/release/$CARGO_BIN")
          echo "$FILE_TYPE"
          case "$FILE_TYPE" in
            *Mach-O*) ;;
            *) echo "::error::не Mach-O: $FILE_TYPE"; exit 1;;
          esac
          ARCHS=$(lipo -archs "target/${{ matrix.target }}/release/$CARGO_BIN")
          echo "$ARCHS"
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            WANT="arm64"
          else
            WANT="x86_64"
          fi
          case "$ARCHS" in
            *"$WANT"*) ;;
            *) echo "::error::ожидалась архитектура $WANT: $ARCHS"; exit 1;;
          esac

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.arch }}-${{ env.NAME }}${{ env.SUFFIX }}
          path: dist/*

  Windows-Subsystem-for-Arxumbra:
    name: ${{ matrix.arch }}-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s5
    runs-on: windows-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-pc-windows-msvc
            arch: aarch64
            xwin: true
            flags: '-C target-cpu=generic -C link-arg=/OPT:REF -C link-arg=/OPT:ICF -C llvm-args=--inline-threshold=1000 -C llvm-args=--unroll-threshold=500'
          - target: x86_64-pc-windows-msvc
            arch: x86_64
            xwin: false
            flags: '-C target-cpu=x86-64 -C target-feature=-sse3,-ssse3,-sse4.1,-sse4.2,-popcnt,-avx,-avx2,-fma,-f16c,-bmi1,-bmi2,-lzcnt,-movbe,-tbm,-avx512f,-avx512bw,-avx512cd,-avx512dq,-avx512vl,-avx512ifma,-avx512vbmi,-avx512vbmi2,-avx512vnni,-avx512vpopcntdq,-avx512bitalg,-vaes,-vpclmulqdq,-gfni,-sha -C link-arg=/OPT:REF -C link-arg=/OPT:ICF -C llvm-args=--inline-threshold=1000 -C llvm-args=--unroll-threshold=500'
    env:
      NAME: Windows-Subsystem-for-Arxumbra
      CARGO_BIN: subsystem-for-arxumbra
      SUFFIX: -v0.0.0.0.0.0-s5
      BUILD_STD: -Zbuild-std=std,panic_abort
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Stage 1 - Rust nightly toolchain
        run: |
          rustup toolchain install nightly --profile minimal -c rust-src
          rustup default nightly
          rustup target add ${{ matrix.target }}
          rustc -vV

      - name: Stage 2 - locked dependency fetch
        run: cargo fetch --locked --target ${{ matrix.target }}

      - name: Stage 3a - build x86_64 (fat LTO, build-std)
        if: ${{ !matrix.xwin }}
        run: |
          $env:RUSTFLAGS = "${{ matrix.flags }}"
          cargo build --release --locked --target ${{ matrix.target }} $env:BUILD_STD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage 3b - build aarch64 (fat LTO, MSVC ARM64 через xwin, build-std)
        if: matrix.xwin
        run: |
          cargo install cargo-xwin --version 0.23.1 --locked
          $env:RUSTFLAGS = "${{ matrix.flags }}"
          cargo xwin build --release --locked --target ${{ matrix.target }} $env:BUILD_STD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage 4 - package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $final = "${{ matrix.arch }}-$env:NAME$env:SUFFIX"
          Copy-Item "target\${{ matrix.target }}\release\$env:CARGO_BIN.exe" "dist\$final.exe"
          Compress-Archive -Path "dist\$final.exe" -DestinationPath "dist\$final.zip" -CompressionLevel Optimal
          Remove-Item "dist\$final.exe"
          (Get-ChildItem "dist\*.zip" | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name }) | Out-File -Encoding ascii "dist\SHA256SUMS-${{ matrix.arch }}.txt"

      - name: Stage 5 - binary identity check (PE, machine type)
        shell: pwsh
        run: |
          $path = "target\${{ matrix.target }}\release\$env:CARGO_BIN.exe"
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $mz = [System.Text.Encoding]::ASCII.GetString($bytes, 0, 2)
          if ($mz -ne 'MZ') { throw "не PE: $mz" }
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $signature = [System.BitConverter]::ToUInt32($bytes, $peOffset)
          if ($signature -ne 0x00004550) { throw "нет PE-сигнатуры: 0x$($signature.ToString('x8'))" }
          $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $want = if ('${{ matrix.arch }}' -eq 'aarch64') { 0xAA64 } else { 0x8664 }
          $hex = '0x' + $machine.ToString('x4')
          Write-Host "machine = $hex"
          if ($machine -ne $want) { throw "ожидалась машина 0x$($want.ToString('x4')), получено $hex" }

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.arch }}-${{ env.NAME }}${{ env.SUFFIX }}
          path: dist/*

  release:
    name: Release
    needs:
      - Linux-Subsystem-for-Arxumbra
      - macOS-Subsystem-for-Arxumbra
      - Windows-Subsystem-for-Arxumbra
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist

      - name: GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            dist/*/*.tar.xz
            dist/*/*.tar.gz
            dist/*/*.zip
            dist/*/SHA256SUMS-*.txt
          generate_release_notes: true

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-aarch64:
    name: aarch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s8
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1

      - name: toolchain
        run: |
          { rustup toolchain install nightly --profile minimal -c rust-src && rustup default nightly && rustup target add aarch64-unknown-linux-gnu; } > /tmp/rustup.log 2>&1 || { cat /tmp/rustup.log; exit 1; }

      - name: system libraries
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libwayland-dev libxkbcommon-dev pkg-config zstd
          command -v zstd > /dev/null

      - name: cached stable llvm
        uses: actions/cache@v4
        with:
          path: ~/llvm
          key: arx-llvm-llvmorg-23.1.2-linux-arm64-7zz2

      - name: stable llvm linker
        run: |
          curl -fsSL --retry 3 -o /tmp/7z.tar.xz https://www.7-zip.org/a/7z2501-linux-arm64.tar.xz
          python3 -c "import shutil, tarfile; shutil.copyfileobj(tarfile.open('/tmp/7z.tar.xz').extractfile('7zzs'), open('/tmp/7zzs', 'wb'))"
          chmod 755 /tmp/7zzs
          /tmp/7zzs > /dev/null
          mkdir -p "$HOME/llvm"
          if [ ! -x "$HOME/llvm/LLVM-23.1.2-Linux-ARM64/bin/ld.lld" ]; then
            curl -fsSL --retry 3 -o /tmp/llvm.tar.zst https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/LLVM-23.1.2-Linux-ARM64.tar.zst
            zstd -dc --long=30 /tmp/llvm.tar.zst | /tmp/7zzs x -si -ttar -y -bso0 -bsp0 -o"$HOME/llvm" 'LLVM-23.1.2-Linux-ARM64/bin/ld.lld' 'LLVM-23.1.2-Linux-ARM64/bin/lld' 'LLVM-23.1.2-Linux-ARM64/bin/llvm-objcopy'
            chmod 755 "$HOME/llvm/LLVM-23.1.2-Linux-ARM64/bin/ld.lld" "$HOME/llvm/LLVM-23.1.2-Linux-ARM64/bin/lld" "$HOME/llvm/LLVM-23.1.2-Linux-ARM64/bin/llvm-objcopy"
            rm -f /tmp/llvm.tar.zst
          fi
          "$HOME/llvm/LLVM-23.1.2-Linux-ARM64/bin/ld.lld" --version > /dev/null || { ls -l "$HOME/llvm/LLVM-23.1.2-Linux-ARM64/bin"; file "$HOME/llvm/LLVM-23.1.2-Linux-ARM64/bin/ld.lld"; exit 1; }

      - name: build
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: '3'
          CARGO_PROFILE_RELEASE_LTO: fat
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
          CARGO_PROFILE_RELEASE_PANIC: immediate-abort
          CARGO_PROFILE_RELEASE_STRIP: symbols
          CARGO_PROFILE_RELEASE_DEBUG: 'false'
          CARGO_PROFILE_RELEASE_INCREMENTAL: 'false'
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: 'false'
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: 'false'
        run: |
          RUSTFLAGS="-C target-cpu=generic -C debuginfo=0 -C strip=symbols -C link-arg=-fuse-ld=lld -C link-arg=-B$HOME/llvm/LLVM-23.1.2-Linux-ARM64/bin -C link-arg=-Wl,--icf=all -C link-arg=-Wl,-O1 -C link-arg=-Wl,--as-needed -C link-arg=-Wl,--gc-sections -C link-arg=-Wl,-z,norelro -C link-arg=-Wl,--build-id=none -C link-arg=-Wl,--no-eh-frame-hdr -C llvm-args=--inline-threshold=1000 -C llvm-args=--unroll-threshold=500 -Zlocation-detail=none -Zfmt-debug=none" \
            cargo build --release --locked --quiet --target aarch64-unknown-linux-gnu '-Zbuild-std=std,panic_abort'
          "$HOME/llvm/LLVM-23.1.2-Linux-ARM64/bin/llvm-objcopy" --remove-section=.comment --remove-section=.note.ABI-tag --remove-section=.note.gnu.property target/aarch64-unknown-linux-gnu/release/Subsystem-for-Arxumbra

      - name: package
        run: |
          mkdir -p dist && cd dist
          cp ../target/aarch64-unknown-linux-gnu/release/Subsystem-for-Arxumbra aarch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s8
          chmod 755 aarch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s8
          bin_bytes=$(( $(wc -c < aarch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s8) ))
          f=aarch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s8.7z
          /tmp/7zzs a -t7z -mx=9 -m0=lzma2 -md=64m -mfb=273 -ms=on -mmt=on -mtc=off -mta=off -mtm=off "$f" aarch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s8
          rm aarch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s8
          [ "$(wc -c < "$f")" -lt 62914560 ] && { echo "archive too small: $(wc -c < "$f")"; exit 1; }
          [ "$(wc -c < "$f")" -gt 104857600 ] && { echo "archive too large: $(wc -c < "$f")"; exit 1; }
          {
            echo "binary_bytes=$bin_bytes"
            echo "archive_bytes=$(( $(wc -c < "$f") ))"
            /tmp/7zzs l -slt "$f" | head -n 40
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: aarch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s8
          path: dist/*


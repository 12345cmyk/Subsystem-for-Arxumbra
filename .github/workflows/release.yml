      - name: cached cargo-xwin
        uses: actions/cache@v4
        with:
          path: ~\cargo-xwin
          key: arx-cargo-xwin-0.23.1

      - name: cached msvc sdk
        uses: actions/cache@v4
        with:
          path: ~\xwin
          key: arx-msvc-sdk-0.23.1

      - name: cargo-xwin
        shell: pwsh
        run: |
          if (-not (Test-Path "$HOME\cargo-xwin\bin\cargo-xwin.exe")) {
            cargo install cargo-xwin --version 0.23.1 --locked --root "$HOME\cargo-xwin" --quiet
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          "$HOME\cargo-xwin\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: build
        shell: pwsh
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: '3'
          CARGO_PROFILE_RELEASE_LTO: fat
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
          CARGO_PROFILE_RELEASE_PANIC: immediate-abort
          CARGO_PROFILE_RELEASE_STRIP: symbols
          CARGO_PROFILE_RELEASE_DEBUG: 'false'
          CARGO_PROFILE_RELEASE_INCREMENTAL: 'false'
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: 'false'
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: 'false'
        run: |
          $env:XWIN_CACHE_DIR = "$HOME\xwin"
          $env:RUSTFLAGS = '-C target-cpu=generic -C debuginfo=0 -C strip=symbols -Clinker=lld-link -C link-arg=/OPT:REF -C link-arg=/OPT:ICF -C llvm-args=--inline-threshold=1000 -C llvm-args=--unroll-threshold=500 -Zlocation-detail=none -Zfmt-debug=none'
          cargo xwin build --release --locked --quiet --target aarch64-pc-windows-msvc '-Zbuild-std=std,panic_abort'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Set-Location dist
          Copy-Item ..\target\aarch64-pc-windows-msvc\release\Subsystem-for-Arxumbra.exe aarch64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s8.exe
          $binBytes = (Get-Item aarch64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s8.exe).Length
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe" }
          $f = 'aarch64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s8.7z'
          & $sevenZip a -t7z -mx=9 -m0=lzma2 -md=64m -mfb=273 -ms=on -mmt=on -mtc=off -mta=off -mtm=off $f aarch64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s8.exe

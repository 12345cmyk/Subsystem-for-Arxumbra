          "archive_bytes=$((Get-Item $f).Length)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          (& $sevenZip l -slt $f | Select-Object -First 40) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8


name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  BIN: linux-subsystem-for-arxumbra

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install nightly-2026-09-13 --profile minimal
          rustup default nightly-2026-09-13

      - name: Build dependencies (wayland) + smoke dependencies (weston, lavapipe)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwayland-dev libxkbcommon-dev pkg-config \
            weston mesa-vulkan-drivers

      - name: Build (FAT LTO, strip)
        run: cargo build --release --locked

      - name: Smoke (25 c, пустой stderr = обе текстуры декодированы)
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          weston --backend=headless-backend.so --socket=arx-smoke --idle-time=0 &
          for i in $(seq 1 30); do [ -e "$XDG_RUNTIME_DIR/arx-smoke" ] && break; sleep 1; done
          [ -e "$XDG_RUNTIME_DIR/arx-smoke" ] || { echo "::error::weston не поднялся"; exit 1; }
          export WAYLAND_DISPLAY=arx-smoke
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          export WGPU_BACKEND=vulkan
          timeout 25 target/release/$BIN 2>/tmp/smoke.err || true
          if [ -s /tmp/smoke.err ]; then
            echo "::error::Smoke-прогон написал в stderr:"
            cat /tmp/smoke.err
            exit 1
          fi
          echo "Smoke OK: stderr пуст"

      - name: Artifact
        run: |
          mkdir dist
          cp target/release/$BIN dist/$BIN
          tar czf dist/$BIN-linux-x86_64.tar.gz -C dist $BIN
          rm dist/$BIN
          sha256sum dist/$BIN-linux-x86_64.tar.gz > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*

  release:
    needs: linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/linux-x86_64/*
          generate_release_notes: true

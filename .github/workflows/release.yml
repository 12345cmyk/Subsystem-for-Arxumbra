  windows-aarch64:
    name: aarch64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s8
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1

      - name: toolchain
        shell: pwsh
        run: |
          rustup toolchain install nightly --profile minimal -c rust-src *> "$env:TEMP\rustup.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:TEMP\rustup.log"; exit 1 }
          rustup default nightly *>> "$env:TEMP\rustup.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:TEMP\rustup.log"; exit 1 }
          rustup target add aarch64-pc-windows-msvc *>> "$env:TEMP\rustup.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:TEMP\rustup.log"; exit 1 }

      - name: cached stable llvm
        uses: actions/cache@v4
        with:
          path: ~\llvm
          key: arx-llvm-llvmorg-23.1.2-windows-7zz2

      - name: stable llvm linker
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ErrorActionPreference = 'Stop'
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe" }
          New-Item -ItemType Directory -Force "$HOME\llvm" | Out-Null
          if (-not (Test-Path "$HOME\llvm\clang+llvm-23.1.2-x86_64-pc-windows-msvc\bin\lld-link.exe")) {
            Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/clang+llvm-23.1.2-x86_64-pc-windows-msvc.tar.zst' -OutFile "$env:TEMP\llvm.tar.zst"
            zstd -d --long=30 -o "$env:TEMP\llvm.tar" "$env:TEMP\llvm.tar.zst"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $sevenZip x "$env:TEMP\llvm.tar" -y -bso0 -bsp0 -o"$HOME\llvm" 'clang+llvm-23.1.2-x86_64-pc-windows-msvc/bin/lld-link.exe' 'clang+llvm-23.1.2-x86_64-pc-windows-msvc/bin/clang-cl.exe' 'clang+llvm-23.1.2-x86_64-pc-windows-msvc/bin/llvm-lib.exe' 'clang+llvm-23.1.2-x86_64-pc-windows-msvc/lib/clang/*'

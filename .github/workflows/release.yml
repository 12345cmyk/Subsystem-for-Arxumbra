name: release

# Автоматизация полного процесса сборки Subsystem-for-Arxumbra.
# Порядок обязателен: Linux -> macOS -> Windows -> Release.
#   Linux   : PGO -> FAT LTO -> BOLT (aggressive), 3 сборки + 4 тренировочных прогона.
#   macOS   : PGO + FAT LTO (BOLT поддерживает только Linux ELF).
#   Windows : PGO + FAT LTO (MSVC), WARP DX12 best-effort.
# Запуск: push тега v* (создаёт GitHub Release) или workflow_dispatch
# (только артефакты, без релиза).
#
# ВАЖНО: cargo-pgo сам добавляет --release и --target <тройка хоста>,
# поэтому бинари лежат в target/<triple>/release/, а не target/release/.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN: linux-subsystem-for-arxumbra
  LINUX_TRIPLE: x86_64-unknown-linux-gnu
  MACOS_TRIPLE: aarch64-apple-darwin
  WINDOWS_TRIPLE: x86_64-pc-windows-msvc

permissions: {}

jobs:
  linux:
    name: Linux x86_64 (PGO + FAT LTO + BOLT)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight - полнота репозитория
        run: |
          missing=0
          for f in Cargo.toml Cargo.lock src/main.rs assets/000.ktx2 assets/menu.ktx2 \
                   rust-toolchain.toml .cargo/config.toml .gitattributes \
                   .gitignore .github/workflows/release.yml tools/train-exit.patch README.md; do
            [ -f "$f" ] || { echo "::error::ОТСУТСТВУЕТ $f"; missing=1; }
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "=================================================================="
            echo "РЕПОЗИТОРИЙ ЗАГРУЖЕН НЕ ПОЛНОСТЬЮ (нужно 12 файлов, см. список выше)."
            echo "Залейте ПОЛНОЕ содержимое архива arxumbra-v8.zip через git:"
            echo "  unzip arxumbra-v8.zip && cd arxumbra-v8"
            echo "  git init -b main && git add -A && git commit -m v8"
            echo "  git remote add origin <ваш-репозиторий>.git && git push -f origin main"
            echo "ВНИМАНИЕ: веб-загрузка файлов на github.com НЕ подходит —"
            echo "assets/000.ktx2 (55 МБ) превышает лимит 25 МБ на файл."
            echo "Готовый бинарь в git не входит (.gitignore: лимит GitHub 100 МБ)."
            echo "=================================================================="
            exit 1
          fi
          echo "Полный набор файлов (12/12): OK"

      - name: Install Rust toolchain
        run: |
          RUSTCHAIN=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$RUSTCHAIN" --profile minimal
          rustup component add llvm-tools-preview
          rustup show active-toolchain

      - name: Install cargo-pgo
        run: cargo install cargo-pgo --locked

      - name: Install BOLT
        run: |
          set -euxo pipefail
          # Ubuntu 24.04: bolt-18 из основного репозитория; fallback на apt.llvm.org.
          sudo apt-get update
          if ! sudo apt-get install -y bolt-18; then
            sudo apt-get install -y ca-certificates wget
            wget -q https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 18
            sudo apt-get install -y bolt-18
          fi
          # cargo-pgo ищет в PATH `llvm-bolt` и `merge-fdata`.
          for b in llvm-bolt merge-fdata; do
            if ! command -v "$b" >/dev/null 2>&1; then
              src=$(ls /usr/bin/$b-18 /usr/lib/llvm-18/bin/$b 2>/dev/null | head -1 || true)
              [ -n "$src" ] && sudo ln -sf "$src" /usr/local/bin/$b
            fi
          done
          command -v llvm-bolt
          command -v merge-fdata
          # Рантайм-библиотека инструментирования должна находиться линкером.
          rt=$(find /usr/lib/llvm-18 /usr/lib -name libbolt_rt_instr.a 2>/dev/null | head -1 || true)
          if [ -n "$rt" ] && [ ! -e /usr/lib/libbolt_rt_instr.a ]; then
            sudo ln -sf "$rt" /usr/lib/libbolt_rt_instr.a
          fi
          ls -l /usr/lib/libbolt_rt_instr.a

      - name: Install weston + lavapipe (headless GPU) + wayland/xkb dev-пакеты
        run: sudo apt-get install -y weston mesa-vulkan-drivers libwayland-dev libxkbcommon-dev pkg-config

      - name: Start headless weston
        run: |
          export XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/run/user/$(id -u)}
          mkdir -p "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=arx-wayland --idle-time=0 &
          for i in $(seq 1 20); do
            [ -e "$XDG_RUNTIME_DIR/arx-wayland" ] && break
            sleep 1
          done
          ls -l "$XDG_RUNTIME_DIR/arx-wayland"

      - name: Apply training patch
        run: |
          git apply tools/train-exit.patch
          grep -c "AppExit::Success" src/main.rs

      - name: Stage 1 - instrumented build (PGO)
        run: cargo pgo build -- --locked

      - name: Stage 2 - PGO training runs (2x)
        run: |
          set -uo pipefail
          export XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/run/user/$(id -u)}
          export WAYLAND_DISPLAY=arx-wayland
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json
          export WGPU_BACKEND=vulkan
          export LLVM_PROFILE_FILE=target/pgo-profiles/train_%m_%p.profraw
          mkdir -p target/pgo-profiles
          INSTR=target/$LINUX_TRIPLE/release/$BIN
          ls -lh "$INSTR"
          for run in 1 2; do
            echo "=== pgo training run $run ==="
            # Патч сам завершает бинарь через 75 c (AppExit::Success) -> чистый дамп профиля.
            timeout 300 "./$INSTR" 2> /tmp/trainp$run.err || echo "run $run exit=$? (профили обычно всё равно собраны)"
            tail -5 /tmp/trainp$run.err || true
          done
          ls -lh target/pgo-profiles/ | head

      - name: Stage 3 - instrumented build (PGO-use + BOLT)
        run: cargo pgo bolt build --with-pgo -- --locked

      - name: Stage 4 - BOLT training runs (2x)
        run: |
          set -uo pipefail
          export XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/run/user/$(id -u)}
          export WAYLAND_DISPLAY=arx-wayland
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json
          export WGPU_BACKEND=vulkan
          INSTR=target/$LINUX_TRIPLE/release/$BIN-bolt-instrumented
          ls -lh "$INSTR"
          for run in 1 2; do
            echo "=== bolt training run $run ==="
            timeout 300 "./$INSTR" 2> /tmp/trainb$run.err || echo "run $run exit=$? (профили обычно всё равно собраны)"
            tail -5 /tmp/trainb$run.err || true
          done
          ls -lh target/bolt-profiles/$BIN/ | head

      - name: Restore pristine sources
        run: git checkout -- src/main.rs

      - name: Stage 5 - final build (PGO + FAT LTO + BOLT aggressive)
        run: >-
          cargo pgo bolt optimize --with-pgo
          --bolt-args='-reorder-blocks=ext-tsp -reorder-functions=hfsort+ -split-functions -split-all-cold -icf=1 -jump-tables=aggressive -peepholes=all -sctc-mode=heuristic -dyno-stats'
          -- --locked

      - name: Strip binary
        run: |
          strip target/$LINUX_TRIPLE/release/$BIN-bolt-optimized
          ls -lh target/$LINUX_TRIPLE/release/$BIN-bolt-optimized

      - name: Smoke test
        run: |
          export XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/run/user/$(id -u)}
          export WAYLAND_DISPLAY=arx-wayland
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json
          export WGPU_BACKEND=vulkan
          FINAL=target/$LINUX_TRIPLE/release/$BIN-bolt-optimized
          # Бинарь - обоина: без Esc он живёт вечно. PASS = выжил под timeout (124)
          # или вышел сам (0), при ПУСТОМ stderr.
          timeout 20 "./$FINAL" 2> /tmp/smoke.err
          code=$?
          if [ $code -ne 0 ] && [ $code -ne 124 ]; then
            echo "smoke test FAILED, exit=$code"; cat /tmp/smoke.err; exit 1
          fi
          if [ -s /tmp/smoke.err ]; then
            echo "smoke test FAILED, stderr не пуст:"; cat /tmp/smoke.err; exit 1
          fi
          echo "smoke test OK (чистый выход, stderr пуст)"

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/$LINUX_TRIPLE/release/$BIN-bolt-optimized dist/$BIN-linux-x86_64
          chmod +x dist/$BIN-linux-x86_64
          tar czf dist/$BIN-linux-x86_64.tar.gz -C dist $BIN-linux-x86_64
          rm dist/$BIN-linux-x86_64
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}-linux-x86_64
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS aarch64 (PGO + FAT LTO)
    needs: linux
    runs-on: macos-14
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight - полнота репозитория
        run: |
          missing=0
          for f in Cargo.toml Cargo.lock src/main.rs assets/000.ktx2 assets/menu.ktx2 \
                   rust-toolchain.toml .cargo/config.toml .gitattributes \
                   .gitignore .github/workflows/release.yml tools/train-exit.patch README.md; do
            [ -f "$f" ] || { echo "::error::ОТСУТСТВУЕТ $f"; missing=1; }
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Репозиторий загружен не полностью - залейте ПОЛНОЕ содержимое arxumbra-v8.zip через git (не веб-загрузку)"
            exit 1
          fi
          echo "Полный набор файлов (12/12): OK"

      - name: Install Rust toolchain
        run: |
          RUSTCHAIN=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$RUSTCHAIN" --profile minimal
          rustup component add llvm-tools-preview
          rustup show active-toolchain

      - name: Install cargo-pgo
        run: cargo install cargo-pgo --locked

      - name: Apply training patch
        run: |
          git apply tools/train-exit.patch
          grep -c "AppExit::Success" src/main.rs

      - name: Instrumented build (PGO)
        run: cargo pgo build -- --locked

      - name: Training runs (2x, best-effort)
        run: |
          set -uo pipefail
          export LLVM_PROFILE_FILE=target/pgo-profiles/train_%m_%p.profraw
          mkdir -p target/pgo-profiles
          run_to() {  # $1=лимит в секундах, остальное - команда
            local secs=$1; shift
            "$@" & local pid=$!
            ( sleep "$secs"; kill -9 "$pid" 2>/dev/null ) & local wd=$!
            wait "$pid"; local rc=$?
            kill "$wd" 2>/dev/null || true
            return $rc
          }
          INSTR=target/$MACOS_TRIPLE/release/$BIN
          ls -lh "$INSTR"
          for run in 1 2; do
            echo "=== training run $run ==="
            # У CI-раннера может не быть интерактивного дисплея: прогон best-effort,
            # профили собираются с того кода, что успел выполниться.
            run_to 300 "./$INSTR" 2> /tmp/train$run.err \
              || echo "run $run exit=$? (best-effort, продолжаем)"
            tail -5 /tmp/train$run.err || true
          done
          echo "--- pgo-profiles:"; ls -lh target/pgo-profiles/ | head

      - name: Restore pristine sources
        run: git checkout -- src/main.rs

      - name: Final build (PGO + FAT LTO)
        run: cargo pgo optimize build -- --locked

      - name: Strip binary
        run: |
          strip target/$MACOS_TRIPLE/release/$BIN
          ls -lh target/$MACOS_TRIPLE/release/$BIN

      - name: Smoke test (best-effort)
        run: |
          run_to() {
            local secs=$1; shift
            "$@" & local pid=$!
            ( sleep "$secs"; kill -9 "$pid" 2>/dev/null ) & local wd=$!
            wait "$pid"; local rc=$?
            kill "$wd" 2>/dev/null || true
            return $rc
          }
          rc=0
          run_to 20 ./target/$MACOS_TRIPLE/release/$BIN 2> /tmp/smoke.err || rc=$?
          if [ $rc -ne 0 ] && [ $rc -ne 124 ] && [ $rc -ne 137 ]; then
            echo "ВНИМАНИЕ: бинарь завершился с кодом $rc (без дисплея на раннере это ожидаемо)"
            tail -5 /tmp/smoke.err || true
          else
            echo "smoke test OK"
          fi

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/$MACOS_TRIPLE/release/$BIN dist/$BIN-macos-aarch64
          chmod +x dist/$BIN-macos-aarch64
          tar czf dist/$BIN-macos-aarch64.tar.gz -C dist $BIN-macos-aarch64
          rm dist/$BIN-macos-aarch64
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}-macos-aarch64
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows x86_64 (PGO + FAT LTO, MSVC)
    needs: macos
    runs-on: windows-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight - полнота репозитория
        shell: bash
        run: |
          missing=0
          for f in Cargo.toml Cargo.lock src/main.rs assets/000.ktx2 assets/menu.ktx2 \
                   rust-toolchain.toml .cargo/config.toml .gitattributes \
                   .gitignore .github/workflows/release.yml tools/train-exit.patch README.md; do
            [ -f "$f" ] || { echo "::error::ОТСУТСТВУЕТ $f"; missing=1; }
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Репозиторий загружен не полностью - залейте ПОЛНОЕ содержимое arxumbra-v8.zip через git (не веб-загрузку)"
            exit 1
          fi
          echo "Полный набор файлов (12/12): OK"

      - name: Install Rust toolchain
        shell: bash
        run: |
          RUSTCHAIN=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$RUSTCHAIN" --profile minimal
          rustup component add llvm-tools-preview
          rustup show active-toolchain

      - name: Install cargo-pgo
        shell: bash
        run: cargo install cargo-pgo --locked

      - name: Apply training patch
        shell: bash
        run: |
          git apply tools/train-exit.patch
          grep -c "AppExit::Success" src/main.rs

      - name: Instrumented build (PGO)
        shell: bash
        run: cargo pgo build -- --locked

      - name: Training runs (2x, best-effort через WARP DX12)
        shell: bash
        run: |
          set -uo pipefail
          export WGPU_BACKEND=dx12
          export LLVM_PROFILE_FILE=target/pgo-profiles/train_%m_%p.profraw
          mkdir -p target/pgo-profiles
          run_to() {  # $1=лимит в секундах, остальное - команда
            local secs=$1; shift
            "$@" & local pid=$!
            ( sleep "$secs"; kill -9 "$pid" 2>/dev/null ) & local wd=$!
            wait "$pid"; local rc=$?
            kill "$wd" 2>/dev/null || true
            return $rc
          }
          INSTR=target/$WINDOWS_TRIPLE/release/$BIN.exe
          ls -lh "$INSTR"
          for run in 1 2; do
            echo "=== training run $run ==="
            # WARP (программный DX12) есть на раннерах; окно в сервисной сессии может не
            # создаться - прогон best-effort, профили собираются частично.
            run_to 300 "./$INSTR" 2> /tmp/train$run.err \
              || echo "run $run exit=$? (best-effort, продолжаем)"
            tail -5 /tmp/train$run.err || true
          done
          echo "--- pgo-profiles:"; ls -lh target/pgo-profiles/ | head

      - name: Restore pristine sources
        shell: bash
        run: git checkout -- src/main.rs

      - name: Final build (PGO + FAT LTO)
        shell: bash
        run: cargo pgo optimize build -- --locked

      - name: Smoke test (best-effort)
        shell: bash
        run: |
          export WGPU_BACKEND=dx12
          run_to() {
            local secs=$1; shift
            "$@" & local pid=$!
            ( sleep "$secs"; kill -9 "$pid" 2>/dev/null ) & local wd=$!
            wait "$pid"; local rc=$?
            kill "$wd" 2>/dev/null || true
            return $rc
          }
          rc=0
          run_to 20 ./target/$WINDOWS_TRIPLE/release/$BIN.exe 2> /tmp/smoke.err || rc=$?
          if [ $rc -ne 0 ] && [ $rc -ne 124 ] && [ $rc -ne 137 ]; then
            echo "ВНИМАНИЕ: бинарь завершился с кодом $rc (без дисплея на раннере это ожидаемо)"
            tail -5 /tmp/smoke.err || true
          else
            echo "smoke test OK"
          fi

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/$WINDOWS_TRIPLE/release/$BIN.exe dist/$BIN-windows-x86_64.exe
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}-windows-x86_64
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true

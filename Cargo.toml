[package]
name = "Subsystem-for-Arxumbra"
version = "0.0.5"
edition = "2024"

[[bin]]
name = "subsystem-for-arxumbra"
path = "src/main.rs"

# One dependency block instead of six byte-identical per-target copies.
# `wayland` is the only target-dependent flag and winit gates its wayland backend
# behind Linux/BSD targets, so the flag is inert on macOS and Windows: the resolved
# graph for those platforms contains no wayland crate at all (verified with
# `cargo metadata --filter-platform`).
[dependencies]
basisu = "0.1"
mimalloc = "0.1"
bevy = { version = "0.20.0-rc.1", default-features = false, features = [
    "std",
    "multi_threaded",
    "keyboard",
    "bevy_winit",
    "bevy_render",
    "bevy_input_focus",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_image",
    "bevy_sprite",
    "bevy_sprite_render",
    "wayland",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false
debug-assertions = false

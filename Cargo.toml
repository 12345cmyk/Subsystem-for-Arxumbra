cargo-features = ["panic-immediate-abort"]

[package]
name = "Subsystem-for-Arxumbra"
version = "0.0.8"
edition = "2024"

[dependencies]
basisu = "0.1"
mimalloc = "0.1"
bevy = { version = "0.20.0-rc.1", default-features = false, features = [
    "std",
    "multi_threaded",
    "keyboard",
    "bevy_winit",
    "bevy_render",
    "bevy_input_focus",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_image",
    "bevy_sprite",
    "bevy_sprite_render",
    "wayland",
] }


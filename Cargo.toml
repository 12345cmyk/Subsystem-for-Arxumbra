[package]
name = "Subsystem-for-Arxumbra"
version = "0.0.4"
edition = "2024"

[[bin]]
name = "linux-subsystem-for-arxumbra"
path = "src/main.rs"

[dependencies]
# Экстремально производительный аллокатор (замена системного malloc):
# thread-local кэши + lock-free пути, статически линкуется (mi-malloc v3).
mimalloc = "0.1"
bevy = { git = "https://github.com/bevyengine/bevy", tag = "v0.19.1", default-features = false, features = [
    "std",
    "multi_threaded",
    "keyboard",
    "bevy_winit",
    "bevy_render",
    "bevy_input_focus",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_image",
    "bevy_sprite",
    "bevy_sprite_render",
    "ktx2",
    "basis-universal",
    "zstd_rust",
] }

# Wayland-бэкенд — только для Linux (macOS: Metal, Windows: DX12 — без фич)
[target.'cfg(target_os = "linux")'.dependencies]
bevy = { git = "https://github.com/bevyengine/bevy", tag = "v0.19.1", default-features = false, features = [
    "wayland",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"
debug = false
incremental = false
overflow-checks = false
debug-assertions = false

[profile.release.package."*"]
opt-level = 3
codegen-units = 1

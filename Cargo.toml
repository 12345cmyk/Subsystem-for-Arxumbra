[package]
name = "Subsystem-for-Arxumbra"
version = "10.0.0"
edition = "2024"

[[bin]]
name = "linux-subsystem-for-arxumbra"
path = "src/main.rs"

[dependencies]
mimalloc = "0.1"
bevy = { git = "https://github.com/bevyengine/bevy", tag = "v0.19.1", default-features = false, features = [
    "std",
    "multi_threaded",
    "keyboard",
    "bevy_winit",
    "bevy_render",
    "bevy_input_focus",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_image",
    "bevy_sprite",
    "bevy_sprite_render",
    "ktx2",
    "basis-universal",
    "zstd_rust",
] }

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { git = "https://github.com/bevyengine/bevy", tag = "v0.19.1", default-features = false, features = [
    "wayland",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false
debug-assertions = false

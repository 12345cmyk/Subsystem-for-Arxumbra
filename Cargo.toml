[package]
name = "Subsystem-for-Arxumbra"
version = "0.0.5"
edition = "2024"

[[bin]]
name = "subsystem-for-arxumbra"
path = "src/main.rs"

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
basisu = "0.1"
mimalloc = "0.1"
bevy = { git = "https://github.com/bevyengine/bevy", tag = "v0.19.1", default-features = false, features = [
    "std",
    "multi_threaded",
    "keyboard",
    "bevy_winit",
    "bevy_render",
    "bevy_input_focus",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_image",
    "bevy_sprite",
    "bevy_sprite_render",
    "wayland",
] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
basisu = "0.1"

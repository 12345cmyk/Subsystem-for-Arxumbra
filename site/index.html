<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Subsystem for Arxumbra</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; background: #101116; color: #fff; font-family: system-ui, sans-serif; }
    .background { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; }
    main { position: relative; min-height: 100vh; min-height: 100svh; display: flex; align-items: end; padding: clamp(24px, 6vw, 80px); background: linear-gradient(transparent 45%, #000b); }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 64px); font-weight: 500; letter-spacing: -.04em; overflow-wrap: anywhere; }
    a { color: inherit; text-underline-offset: 5px; }
    a:focus-visible { outline: 2px solid white; outline-offset: 6px; }
    nav { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 20px; }
    #background-error { max-width: 48ch; line-height: 1.6; }
  </style>
</head>
<body>
  <!-- External Google Drive image: the source file must remain publicly accessible. -->
  <img class="background" id="background" src="https://lh3.googleusercontent.com/d/1Q5QH-sdlCeAQ2_dby7veBgO0btfzLtUK=w3840" alt="" referrerpolicy="no-referrer">
  <main>
    <section aria-labelledby="title">
      <h1 id="title">Subsystem for Arxumbra</h1>
      <nav aria-label="Ссылки проекта">
        <a href="https://github.com/12345cmyk/Subsystem-for-Arxumbra">GitHub</a>
        <a href="https://drive.google.com/file/d/1Q5QH-sdlCeAQ2_dby7veBgO0btfzLtUK/view?usp=sharing">Открыть фон</a>
      </nav>
      <p id="background-error" role="status" hidden>Не удалось загрузить фон с Google Drive. Проверьте доступ к файлу по ссылке «Открыть фон».</p>
      <noscript><p>Фон загружается напрямую с Google Drive. Файл должен быть доступен всем по ссылке.</p></noscript>
    </section>
  </main>
  <script>
    const background = document.getElementById('background');
    function showBackgroundError() {
      background.hidden = true;
      document.getElementById('background-error').hidden = false;
    }
    background.addEventListener('error', showBackgroundError);
    if (background.complete && background.naturalWidth === 0) showBackgroundError();
  </script>
</body>
</html>
